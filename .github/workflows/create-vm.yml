name: Try to Create OCI VM

on:
  schedule:
    # 每 10 分钟自动尝试一次
    - cron: "*/10 * * * *"
  # 支持在 GitHub 页面上手动触发
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Cache pip packages
        id: cache-pip
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: ${{ runner.os }}-pip-oci-cli-v1

      - name: Add OCI CLI to path
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup OCI CLI and Try to Create VM
        id: create_vm
        continue-on-error: true
        env:
          KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          SSH_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
        run: |
          set -o pipefail

          pip install oci-cli

          # 1. 写入 API 私钥（严格使用绝对路径）
          mkdir -p /home/runner/.oci
          printf '%s\n' "$KEY_CONTENT" > /home/runner/.oci/oci_api_key.pem
          chmod 600 /home/runner/.oci/oci_api_key.pem

          # 2. 写入 OCI Config 配置文件（key_file 必须为绝对路径）
          echo "[DEFAULT]" > /home/runner/.oci/config
          echo "user=${{ secrets.OCI_CLI_USER }}" >> /home/runner/.oci/config
          echo "fingerprint=${{ secrets.OCI_CLI_FINGERPRINT }}" >> /home/runner/.oci/config
          echo "tenancy=${{ secrets.OCI_CLI_TENANCY }}" >> /home/runner/.oci/config
          echo "region=${{ secrets.OCI_CLI_REGION }}" >> /home/runner/.oci/config
          echo "key_file=/home/runner/.oci/oci_api_key.pem" >> /home/runner/.oci/config
          chmod 600 /home/runner/.oci/config

          # 3. 写入 SSH 公钥
          printf '%s\n' "$SSH_KEY" > /home/runner/my_ssh_key.pub

          # 4. 随机休眠 30 到 180 秒（打散时间点，防风控）
          SLEEP_TIME=$(( 30 + RANDOM % 151 ))
          echo "Random sleep for ${SLEEP_TIME} seconds before launching instance..."
          sleep $SLEEP_TIME

          # 5. 发起创建请求
          OCI_OUTPUT=$(oci compute instance launch \
            --compartment-id "${{ secrets.OCI_COMPARTMENT_ID }}" \
            --availability-domain "${{ secrets.AD_NAME }}" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus":4,"memoryInGBs":24}' \
            --subnet-id "${{ secrets.OCI_SUBNET_ID }}" \
            --image-id "${{ secrets.IMAGE_ID }}" \
            --ssh-authorized-keys-file "/home/runner/my_ssh_key.pub" \
            --assign-public-ip true \
            --display-name "arm-instance-1" \
            --boot-volume-size-in-gbs 100 2>&1 || true)

          # 记录输出
          echo "log_data<<EOF" >> $GITHUB_OUTPUT
          echo "$OCI_OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # 判断结果
          if echo "$OCI_OUTPUT" | grep -q '"lifecycle-state": "PROVISIONING"'; then
            echo "Success! VM is provisioning."
            exit 0
          else
            echo "Error: Out of capacity or request failed."
            exit 1
          fi

      - name: Send Discord Notification
        if: always()
        uses: sarisia/actions-status-discord@v1.15.4
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: "OCI ARM VM Status: ${{ steps.create_vm.outcome }}"
          status: ${{ steps.create_vm.outcome }}
          color: ${{ steps.create_vm.outcome == 'success' && '0x28a745' || '0xdc3545' }}
          description: |
            **Status:** `${{ steps.create_vm.outcome }}`
            ```json
            ${{ steps.create_vm.outputs.log_data }}
            ```
